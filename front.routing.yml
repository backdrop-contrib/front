front.admin_index:
  path: '/admin/config/front'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
  requirements:
    _permission: 'administer front page'

front.settings:
  path: '/admin/config/front/settings'
  defaults:
    _form: 'Drupal\front\Form\FrontPageSettingsForm'
    _title: 'Settings'
  requirements:
    _permission: 'administer front page'

front.home_links:
  path: '/admin/config/front/home-links'
  defaults:
    _form: 'Drupal\front\Form\FrontPageHomeLinksForm'
    _title: 'Home links'
  requirements:
    _permission: 'administer front page'
